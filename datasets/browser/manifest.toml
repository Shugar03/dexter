# Dexter eval dataset — labeled decision points over real rendered pages.
#
# Each [[page]] declares a goal and the gold answer a teacher (me) chose.
# `gold.type = "act"` resolves `gold.target` against the live DOM at
# harvest time and binds the element id; `gold.type = "route"` labels
# "don't act" decisions (wait/abstain/escalate).
#
# Harvest:
#   chromedriver --port=9515 &
#   dexter --driver browser --browser-url http://localhost:9515 \
#     eval harvest datasets/browser/manifest.toml -o datasets/browser/items.jsonl

[[page]]
id = "checkout-pay"
path = "pages/checkout.html"
goal = "pay for the order"
[page.gold]
type = "act"
[page.gold.target]
role = "button"
name = "Pay now"

[[page]]
id = "checkout-back-distractor"
