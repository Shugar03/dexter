# modal-confirm — a two-step dialog chain: pressing "Descartar" opens
# a confirmation modal whose "Descartar borrador" button is the real
# commit. Measures chained destructive-confirm flows: the engine must
# navigate a dialog that didn't exist at step 0.
[scenario]
id = "modal-confirm"
goal = "descartar el borrador"
optimal_steps = 2
app = "Editor"

[task]
done_when = { type = "element_exists", target = { role = "static_text", name_contains = "descartado" } }
max_steps = 8

[[world.element]]
id = 1
role = "window"
name = "Editor de texto"

[[world.element]]
id = 3
role = "text_area"
value = "borrador sin enviar"

[[world.element]]
id = 4
role = "button"
name = "Descartar"
actions = ["press"]

[[world.element]]
id = 5
role = "button"
name = "Guardar"
actions = ["press"]

# The confirmation modal: appears only after "Descartar" is pressed.
[[world.rule]]
when = { name = "Descartar" }
effect = { type = "spawn", element = { id = 0, role = "button", name = "Descartar borrador", actions = ["press"] } }

[[world.rule]]
when = { name = "Descartar borrador" }
effect = { type = "spawn", element = { id = 0, role = "static_text", name = "Borrador descartado" } }
