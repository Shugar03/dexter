# calc-scientific — real menu navigation on Calculator: Presentación →
# Científica swaps the keypad for scientific buttons. Verifies a new
# control spawned (Raíz cuadrada), not a pixel guess.
#
# Calculator persists its mode across quit, so teardown returns it to
# Básica first — without that the scenario would complete vacuously on
# the next run.
#
# Targets are Spanish AX names: prep pins the app to es-ES via
# AppleLanguages so the scenario is deterministic on any host locale
# (CI runners are en-US); teardown deletes the override.
[scenario]
id = "calc-scientific"
driver = "macos"
goal = "abrir científica"
optimal_steps = 1
app = "Calculadora"

[live]
app = "com.apple.calculator"
prep = "osascript -e 'tell application id \"com.apple.calculator\" to quit' 2>/dev/null || true; defaults write com.apple.calculator AppleLanguages -array es; sleep 0.5; open -a Calculator; sleep 0.8; dexter click --app com.apple.calculator --target '{\"role\":\"menu_item\",\"name\":\"Básica\"}' --approve 2>/dev/null || true"
teardown = "dexter click --app com.apple.calculator --target '{\"role\":\"menu_item\",\"name\":\"Básica\"}' --approve 2>/dev/null || true; osascript -e 'tell application id \"com.apple.calculator\" to quit'; defaults delete com.apple.calculator AppleLanguages 2>/dev/null || true"
settle_ms = 1200

[task]
done_when = { type = "element_exists", target = { role = "button", name = "Raíz cuadrada" } }
max_steps = 6
