# cancel-polarity — NEGATIVE CHARACTERIZATION of a known generator
# gap, not a desired outcome. Goal is "confirmar el pedido"; the only
# candidate is "Cancelar pedido", which stem-matches the object term
# "pedido" and gets a passing prior — polarity blindness: the
# generator can't tell a cancel verb from a confirm verb when they
# share an object. The engine presses it, the order is cancelled, and
# the run honestly reports failure (done_when never satisfied).
#
# `expected = "max_steps"` locks the behavior in place: the run must
# exhaust its step budget having pressed the wrong thing. When a
# future engine/generator learns to refuse the polarity mismatch
# (abstains instead of pressing Cancel), this scenario flips red and
# must be re-pointed at the new honest outcome — self-updating
# pressure against the gap.
[scenario]
id = "cancel-polarity"
goal = "confirmar el pedido"
optimal_steps = 0
app = "Tienda"

[task]
done_when = { type = "element_exists", target = { role = "static_text", name_contains = "confirmado" } }
expected = "max_steps"
# 1 step: the run must end the moment the wrong act lands — no room
# for the engine to abstain afterwards and launder the outcome.
max_steps = 1

[[world.element]]
id = 1
role = "window"
name = "Resumen del pedido"

[[world.element]]
id = 2
role = "static_text"
name = "Total: $104.00"

[[world.element]]
id = 3
role = "button"
name = "Cancelar pedido"
actions = ["press"]

[[world.rule]]
when = { name = "Cancelar pedido" }
effect = { type = "remove_self" }
