# cancel-polarity — polarity-veto POSITIVE test. Goal is "confirmar el
# pedido"; the only label in the world is "Cancelar pedido", which
# stem-matches the object term "pedido" — but the antonym veto
# (confirmar↔cancelar) drops it before scoring, so no candidate is
# generated and the engine honestly abstains. Before the veto this
# scenario pinned the wrong-act outcome ("max_steps" after pressing
# Cancel); if the veto regresses, it flips red again.
[scenario]
id = "cancel-polarity"
goal = "confirmar el pedido"
optimal_steps = 0
app = "Tienda"

[task]
done_when = { type = "element_exists", target = { role = "static_text", name_contains = "confirmado" } }
expected = "abstained"
# 1 step is all an abstention needs.
max_steps = 1

[[world.element]]
id = 1
role = "window"
name = "Resumen del pedido"

[[world.element]]
id = 2
role = "static_text"
name = "Total: $104.00"

[[world.element]]
id = 3
role = "button"
name = "Cancelar pedido"
actions = ["press"]

[[world.rule]]
when = { name = "Cancelar pedido" }
effect = { type = "remove_self" }
