# items.jsonl is the labeled snapshot of real public pages captured 2026-10-25.
# Live pages drift, so a re-harvest re-binds element ids and must be re-reviewed before replacing items.jsonl.
# real-hn-hide-specific and real-bbc-save-specific are twin-specific and snapshot-only.
# last_act on goal_complete items is teacher-annotated, not captured.
# Example: last_act = { action = { type = "click", target = { role = "link", name = "Read more" }, button = "left" }, delta = "changed" }

[[page]]
