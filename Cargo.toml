[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/driver",
    "crates/world-model",
    "crates/policy",
    "crates/verify",
    "crates/engine",
    "crates/decision",
    "crates/eval",
    "crates/laya",
    "crates/mcp",
    "drivers/macos",
    "drivers/sim",
    "drivers/browser",
    "apps/dexter",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dexter-core = { path = "crates/core" }
dexter-driver = { path = "crates/driver" }
dexter-world-model = { path = "crates/world-model" }
dexter-policy = { path = "crates/policy" }
dexter-verify = { path = "crates/verify" }
dexter-engine = { path = "crates/engine" }
dexter-decision = { path = "crates/decision" }
dexter-eval = { path = "crates/eval" }
dexter-laya = { path = "crates/laya" }
dexter-mcp = { path = "crates/mcp" }
dexter-macos = { path = "drivers/macos" }
dexter-sim = { path = "drivers/sim" }
dexter-browser = { path = "drivers/browser" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
regex = "1"

# macOS FFI
accessibility = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
cocoa = "0.26"
objc = "0.2"
xcap = "0.9"
image = "0.25"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
