[package]
name = "dexter-mcp"
description = "Dexter MCP stdio server — exposes observe/act/verify/task to MCP agents"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dexter-core.workspace = true
dexter-driver.workspace = true
dexter-engine.workspace = true
dexter-decision.workspace = true
dexter-policy.workspace = true
dexter-verify.workspace = true
rmcp = { version = "0.8.5", features = ["server", "client", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars = "1"
thiserror.workspace = true
anyhow.workspace = true

[dev-dependencies]
dexter-policy.workspace = true
dexter-sim.workspace = true
